<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity Research Paper Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Private full-text library of research papers by Infinity university candidates. Loads only its own data files.">
<style>
:root {
  --bg: #161718; --bar: #1c1d1f; --surface: #1d1e20; --sunk: #26282b; --ink: #e8e9eb; --muted: #a3a7ad; --line: #34363a;
  --accent: #8ab4f8; --accent-ink: #0f1d33; --accent-soft: #1f2c40; --link: #9db8ff;
  --mark: #6b5414; --mark-ink: #fff2c7; --mark-cur: #b5841b;
  --ok: #7fd99b; --ok-bg: #1d3a26; --part: #f2c869; --part-bg: #3b3014; --no: #f19a8f; --no-bg: #40211e; --dup: #b2b6bc; --dup-bg: #2b2d31;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: ui-monospace, Menlo, Consolas, monospace;
  --f-read: Charter, "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f5f6f7; --bar: #ffffff; --surface: #ffffff; --sunk: #eef0f2; --ink: #17191c; --muted: #5d636b; --line: #dcdfe3;
  --accent: #2a62c9; --accent-ink: #ffffff; --accent-soft: #e5edfb; --link: #2353b0;
  --mark: #ffe08a; --mark-ink: #2a2000; --mark-cur: #ffb02e;
  --ok: #1c7a43; --ok-bg: #ddf2e5; --part: #8a5a00; --part-bg: #faeecf; --no: #a5332a; --no-bg: #fbe3e0; --dup: #63686f; --dup-bg: #eceef0;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f5f6f7; --bar: #ffffff; --surface: #ffffff; --sunk: #eef0f2; --ink: #17191c; --muted: #5d636b; --line: #dcdfe3;
  --accent: #2a62c9; --accent-ink: #ffffff; --accent-soft: #e5edfb; --link: #2353b0;
  --mark: #ffe08a; --mark-ink: #2a2000; --mark-cur: #ffb02e;
  --ok: #1c7a43; --ok-bg: #ddf2e5; --part: #8a5a00; --part-bg: #faeecf; --no: #a5332a; --no-bg: #fbe3e0; --dup: #63686f; --dup-bg: #eceef0;
  color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
a { color: var(--link); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
mark.cur { background: var(--mark-cur); color: #000; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-size: 19px; font-weight: 700; white-space: nowrap; }
.brand span { font-weight: 400; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button { background: none; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
nav.tabs button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.totals { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; display: flex; gap: 12px; align-items: center; }
.iconbtn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; color: var(--muted); }
.loadbar { height: 3px; background: var(--sunk); }
.loadbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.searchbar { padding-block: 22px 4px; }
.searchrow { display: flex; gap: 10px; }
#q { flex: 1; min-width: 0; padding: 13px 16px; font-size: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
#q:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 0 22px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.9; }
code { font-family: var(--f-mono); font-size: 12px; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--ink); }
.examples { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
.examples button { font-family: var(--f-mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.examples button:hover { border-color: var(--accent); color: var(--accent); }
.main { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; padding-block: 18px 48px; }
aside.filters { display: flex; flex-direction: column; gap: 14px; }
.filters label.l { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.filters select, .filters input[type=text] { width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.filters .row2 { display: flex; gap: 6px; }
.filters .chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.resulthead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 12px; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); }
.sortbox { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.sortbox select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 16.5px; line-height: 1.35; }
.card h3 a { color: var(--ink); text-decoration: none; cursor: pointer; }
.card h3 a:hover { color: var(--accent); text-decoration: underline; }
.meta { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.meta .who a { color: var(--ink); font-weight: 500; text-decoration: none; cursor: pointer; }
.meta .who a:hover { text-decoration: underline; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.b { font-size: 12px; border-radius: 999px; padding: 1px 9px; border: 1px solid transparent; white-space: nowrap; }
.b.Complete { background: var(--ok-bg); color: var(--ok); }
.b.Partial { background: var(--part-bg); color: var(--part); }
.b.Unavailable { background: var(--no-bg); color: var(--no); }
.b.Duplicate { background: var(--dup-bg); color: var(--dup); }
.b.topic { border-color: var(--line); color: var(--muted); }
.b.review { background: var(--part-bg); color: var(--part); }
.snip { margin-top: 10px; font-size: 14px; color: var(--ink); border-left: 3px solid var(--line); padding: 2px 0 2px 12px; overflow-wrap: anywhere; }
.snip + .snip { margin-top: 6px; }
.snip .pg { color: var(--muted); font-size: 12px; margin-right: 6px; font-family: var(--f-mono); }
.hits { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
.more { margin-top: 14px; text-align: center; }
table.grid { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
table.grid th, table.grid td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.grid th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--sunk); cursor: pointer; white-space: nowrap; }
table.grid td.n { text-align: right; font-variant-numeric: tabular-nums; }
table.grid tr.clk { cursor: pointer; }
table.grid tr.clk:hover td { background: var(--accent-soft); }
.tablewrap { overflow-x: auto; }
/* viewer */
#viewer { position: fixed; inset: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); display: flex; flex-direction: column; }
#viewer .vbar { background: var(--bar); border-bottom: 1px solid var(--line); }
#viewer .vbar .wrap { display: flex; gap: 10px; align-items: center; padding-block: 8px; flex-wrap: wrap; }
#viewer .vbar .t { font-weight: 600; flex: 1; min-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#viewer .vbody { flex: 1; overflow: auto; }
#viewer .vgrid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; padding-block: 20px 60px; }
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px 36px; font-family: var(--f-read); font-size: 16.5px; line-height: 1.65; min-width: 0; overflow-wrap: anywhere; }
.paper h1 { font-size: 26px; line-height: 1.25; margin: 6px 0 14px; font-family: var(--f-body); }
.paper h2 { font-size: 20px; margin: 26px 0 8px; font-family: var(--f-body); }
.paper h3 { font-size: 17px; margin: 20px 0 6px; font-family: var(--f-body); }
.paper h4 { font-size: 15.5px; margin: 16px 0 4px; font-family: var(--f-body); }
.paper p { margin: 0 0 12px; }
.paper .pm { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); border-top: 1px dashed var(--line); margin: 22px 0 10px; padding-top: 4px; }
.paper .cap { font-style: italic; color: var(--muted); font-size: 15px; }
.paper .math { font-family: var(--f-mono); font-size: 13px; background: var(--sunk); padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 0 0 12px; white-space: pre-wrap; }
.paper pre { font-family: var(--f-mono); font-size: 12.5px; background: var(--sunk); padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
.paper .tbl { overflow-x: auto; margin: 0 0 14px; }
.paper table { border-collapse: collapse; font-family: var(--f-body); font-size: 13px; }
.paper td, .paper th { border: 1px solid var(--line); padding: 4px 7px; vertical-align: top; }
.paper ul { margin: 0 0 12px; padding-left: 22px; }
.paper .notice { font-family: var(--f-body); background: var(--part-bg); color: var(--part); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
.paper .unav { font-family: var(--f-body); background: var(--no-bg); color: var(--no); border-radius: 8px; padding: 12px 16px; font-size: 14px; }
.side { font-size: 13.5px; display: flex; flex-direction: column; gap: 14px; min-width: 0; position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 90px); overflow-y: auto; }
@media (max-width: 900px) { .side { position: static; max-height: none; } }
.side .box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-wrap: anywhere; }
.side h4 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.side dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: 2px; }
.side dt { color: var(--muted); font-size: 12px; margin-top: 6px; }
.side dd { margin: 0; }
.att { font-size: 12.5px; }
.att li { margin-bottom: 4px; }
.fdet > summary { display: none; }
@media (max-width: 900px) {
  .fdet > summary { display: list-item; cursor: pointer; font-weight: 600; padding: 8px 0; color: var(--muted); }
  .fdet[open] > summary { margin-bottom: 8px; }
  .main { grid-template-columns: 1fr; }
  #viewer .vgrid { grid-template-columns: 1fr; }
  .paper { padding: 18px 16px; }
  .totals { margin-left: 0; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Infinity <span>Research Paper Library</span></div>
    <nav class="tabs">
      <button data-tab="search" aria-current="true">Search</button>
      <button data-tab="cands">Candidates</button>
      <button data-tab="about">About</button>
    </nav>
    <div class="totals"><span id="totals">Loading…</span><button class="iconbtn" id="theme" title="Toggle light / dark">◐</button></div>
  </div>
  <div class="loadbar"><i id="loadbar"></i></div>
</header>

<section id="tab-search">
  <div class="wrap searchbar">
    <form id="form" class="searchrow" autocomplete="off">
      <input id="q" type="search" placeholder='Search full paper text, titles and authors, e.g. "large language models" AND inference' aria-label="Search">
      <button class="btn primary" type="submit">Search</button>
    </form>
    <div class="hint">
      <code>"exact phrase"</code> <code>cuda AND memory</code> (default is AND) <code>transformer OR inference</code>
      <code>-survey</code> or <code>NOT survey</code> to exclude <code>optimiz*</code> prefix
      <code>title:quantization</code> <code>author:smith</code> &middot; case-insensitive &middot; plain words also match plurals
    </div>
    <div class="examples" id="examples">Try:</div>
  </div>
  <div class="wrap main">
    <details class="fdet" id="fdet" open><summary>Filters</summary>
    <aside class="filters" id="filters">
      <div><label class="l" for="f-uni">University</label><select id="f-uni"><option value="">All universities</option></select></div>
      <div><label class="l" for="f-cand">Candidate</label><select id="f-cand"><option value="">All candidates</option></select></div>
      <div><label class="l">Publication year</label><div class="row2"><select id="f-y1" aria-label="From year"><option value="">From</option></select><select id="f-y2" aria-label="To year"><option value="">To</option></select></div></div>
      <div><label class="l" for="f-type">Publication type</label><select id="f-type"><option value="">All types</option></select></div>
      <div><label class="l" for="f-venue">Journal or conference</label><input id="f-venue" type="text" list="venues" placeholder="Any venue (type to filter)"><datalist id="venues"></datalist></div>
      <div><label class="l" for="f-topic">Research topic</label><select id="f-topic"><option value="">All topics</option></select></div>
      <div><label class="l" for="f-ft">Full-text availability</label><select id="f-ft"><option value="">Any</option><option value="yes">Full text archived</option><option value="no">No full text</option></select></div>
      <div><label class="l" for="f-status">Archive status</label><select id="f-status"><option value="">Any status</option><option>Complete</option><option>Partial</option><option>Unavailable</option></select></div>
      <div><label class="l" for="f-scope">Search in</label><select id="f-scope"><option value="all">Titles, authors and full text</option><option value="text">Full text only</option><option value="title">Titles only</option><option value="authors">Authors only</option></select></div>
      <label class="chk"><input type="checkbox" id="f-abs"> Also match abstracts of papers without full text (shown as abstract-only)</label>
      <label class="chk"><input type="checkbox" id="f-rev"> Only records flagged for attribution review</label>
      <button class="btn" id="resetf" type="button">Reset filters</button>
    </aside>
    </details>
    <div>
      <div class="resulthead">
        <div class="count" id="count"></div>
        <div class="sortbox"><label for="sort">Sort</label>
          <select id="sort"><option value="rel">Relevance</option><option value="new">Newest</option><option value="old">Oldest</option><option value="title">Title A–Z</option><option value="len">Longest text</option></select></div>
      </div>
      <div class="list" id="list"></div>
      <div class="more"><button class="btn" id="showmore" hidden>Show more</button></div>
    </div>
  </div>
</section>

<section id="tab-cands" hidden>
  <div class="wrap" style="padding-block:20px 48px">
    <div class="resulthead">
      <input id="cfilter" type="search" placeholder="Filter candidates by name, ID or university" style="flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">
      <div class="count" id="ccount"></div>
    </div>
    <div class="tablewrap"><table class="grid" id="ctable"></table></div>
    <div id="cdetail" style="margin-top:22px"></div>
  </div>
</section>

<section id="tab-about" hidden>
  <div class="wrap" style="padding-block:20px 48px;max-width:860px" id="about"></div>
</section>

<div id="viewer" hidden>
  <div class="vbar"><div class="wrap">
    <button class="btn" id="vclose">← Back</button>
    <div class="t" id="vtitle"></div>
    <span class="count" id="vhits"></span>
    <button class="btn" id="vprev" title="Previous match">↑</button>
    <button class="btn" id="vnext" title="Next match">↓</button>
  </div></div>
  <div class="vbody" id="vbody"><div class="wrap vgrid"><article class="paper" id="paper"></article><aside class="side" id="vside"></aside></div></div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// LOCAL: page opened from disk or a local server, where the Publications/ .md files sit next to it.
// HIST: page is the top-level window (disk, localhost, GitHub Pages), so #q= / #pub= links and back/forward work.
const LOCAL = location.protocol === "file:" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
let HIST = false; try { HIST = window.top === window; } catch (e) {}
const LIB = { index: null, cands: [], pubs: [], recs: [], text: {}, loaded: 0 };
const state = { results: [], shown: 0, terms: [], page: 30 };

// ---------- loading (fetch when served over http, script tags when opened from disk)
function loadScript(src) { return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("missing " + src)); document.head.appendChild(s); }); }
async function getData(name, jsonPath) {
  if (location.protocol !== "file:") {
    try { const r = await fetch(jsonPath); if (r.ok) return await r.json(); } catch (e) {}
  }
  await loadScript("data/js/" + name + ".js");
  return window.__LIB[name];
}
async function boot() {
  try {
    LIB.index = await getData("index", "data/index.json");
    LIB.cands = await getData("candidates", "data/candidates.json");
    const p = await getData("publications", "data/publications.json");
    LIB.pubs = p.publications; LIB.recs = p.records;
  } catch (e) {
    $("#list").innerHTML = `<div class="empty">Could not load the library data (${esc(e.message)}). Keep index.html next to the <code>data</code> folder.</div>`;
    return;
  }
  LIB.pubById = Object.fromEntries(LIB.pubs.map(p => [p.id, p]));
  LIB.candById = Object.fromEntries(LIB.cands.map(c => [c.id, c]));
  LIB.recsByPub = {}; for (const r of LIB.recs) (LIB.recsByPub[r.pid] ||= []).push(r);
  for (const p of LIB.pubs) {
    p._authors = (p.authors || []).join("; ");
    p._cnames = p.candidates.map(id => LIB.candById[id]?.name || id);
    p._review = (LIB.recsByPub[p.id] || []).some(r => r.review);
  }
  fillFilters(); renderAbout(); renderCands();
  const c = LIB.index.counts;
  $("#totals").textContent = `${c.candidates} candidates · ${c.records.toLocaleString()} records · ${c.publications.toLocaleString()} publications · ${c.fulltext.toLocaleString()} with full text`;
  applyHash();
  const shards = LIB.index.shards;
  for (let i = 0; i < shards.length; i++) {
    try { const d = await getData(shards[i], `data/full_text/${shards[i]}.json`); Object.assign(LIB.text, d.docs); if (window.__LIB) delete window.__LIB[shards[i]]; } catch (e) { console.warn(e); }
    LIB.loaded = i + 1; $("#loadbar").style.width = (100 * (i + 1) / shards.length) + "%";
    if ((i + 1) % 4 === 0 || i === shards.length - 1) runSearch(false);
  }
  setTimeout(() => $(".loadbar").hidden = true, 600);
}

// ---------- filters
function opt(sel, vals) { const el = $(sel); for (const [v, t] of vals) { const o = document.createElement("option"); o.value = v; o.textContent = t; el.appendChild(o); } }
function fillFilters() {
  const unis = [...new Set(LIB.cands.map(c => c.university))];
  opt("#f-uni", unis.map(u => [u, u]));
  opt("#f-cand", [...LIB.cands].sort((a, b) => a.name.localeCompare(b.name)).map(c => [c.id, `${c.name} (${c.university.replace(" University", "")})`]));
  const years = [...new Set(LIB.pubs.map(p => +p.year).filter(Boolean))].sort((a, b) => b - a);
  opt("#f-y1", years.map(y => [y, y])); opt("#f-y2", years.map(y => [y, y]));
  const types = {}; LIB.pubs.forEach(p => { if (p.type) types[p.type] = (types[p.type] || 0) + 1; });
  opt("#f-type", Object.entries(types).sort((a, b) => b[1] - a[1]).map(([t, n]) => [t, `${t} (${n})`]));
  const venues = {}; LIB.pubs.forEach(p => { if (p.venue) venues[p.venue] = (venues[p.venue] || 0) + 1; });
  $("#venues").innerHTML = Object.entries(venues).sort((a, b) => b[1] - a[1]).map(([v]) => `<option value="${esc(v)}">`).join("");
  const tc = {}; LIB.pubs.forEach(p => (p.topics || []).forEach(t => tc[t] = (tc[t] || 0) + 1));

// ---------- query parsing

// ---------- search
function filtersPass(p) {

  if (uni && !p.candidates.some(id => LIB.candById[id]?.university === uni)) return false;
  const y1 = +v("#f-y1"), y2 = +v("#f-y2"), y = +p.year;

  if (y2 && (!y || y > Math.max(y1 || y2, y2))) return false;

  const ven = $("#f-venue").value.trim().toLowerCase(); if (ven && !(p.venue || "").toLowerCase().includes(ven)) return false;

  else if (tp && !tp.startsWith("__") && !p.topics.includes(tp)) return false;

}
function fieldsFor(p, t, scope, useAbs) {

  if (f === "author") return [p._authors];

}

    old: (a, b) => (+a.p.year || 9999) - (+b.p.year || 9999), title: (a, b) => a.p.title.localeCompare(b.p.title), len: (a, b) => b.p.chars - a.p.chars }[s];

function snippetsFor(p, n = 2) {

// ---------- viewer
let marks = [], cur = -1;
function mdToHtml(md) {
  const L = md.split("\n"); const out = []; let para = [];
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    let m;
    if ((m = l.match(/^<!-- Page (\d+) -->$/))) { flush(); out.push(`<div class="pm" id="pg-${m[1]}">Page ${m[1]}</div>`); continue; }
    if (!l.trim()) { flush(); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { flush(); const n = m[1].length; out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if (l.startsWith("```")) { flush(); const buf = []; i++; while (i < L.length && !L[i].startsWith("```")) buf.push(L[i++]); out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue; }
    if (l.startsWith("$$")) { flush(); out.push(`<div class="math">${esc(l)}</div>`); continue; }
    if (l.startsWith("|")) {
      flush(); const rows = []; while (i < L.length && L[i].startsWith("|")) rows.push(L[i++]); i--;
      const cells = r => r.replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.replace(/\\\|/g, "|").trim());
      const body = rows.filter(r => !/^\|(\s*-+\s*\|)+\s*$/.test(r));
      out.push(`<div class="tbl"><table>${body.map((r, k) => `<tr>${cells(r).map(c => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`);
      continue;
    }
    if (/^- /.test(l)) { flush(); const items = []; while (i < L.length && /^- /.test(L[i])) items.push(L[i++].slice(2)); i--; out.push(`<ul>${items.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); continue; }
    if (/^\*[^*].*\*$/.test(l.trim())) { flush(); out.push(`<p class="cap">${inline(l.trim().slice(1, -1))}</p>`); continue; }
    if (l.startsWith("> ")) { flush(); out.push(`<div class="notice">${inline(l.slice(2))}</div>`); continue; }
    para.push(l);
  }
  flush();
  return out.join("\n");
}
function inline(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
function highlightDom(root) {

}

  const tr = e.target.closest("tr[data-cid]"); if (tr) showCand(tr.dataset.cid);
});
function showCand(cid) {
  const c = LIB.candById[cid]; const recs = LIB.recs.filter(r => r.cid === cid);
  $("#cdetail").innerHTML = `<div class="card"><h3>${esc(c.name)} <span style="color:var(--muted);font-weight:400">(${esc(c.id)})</span></h3>
    <div class="meta"><span>${esc(c.university)}</span><span>${esc(c.degree)}</span><span>${esc(c.program)}</span><span>Match: ${esc(c.match_status)}</span>
    ${c.openalex ? `<a href="${esc(c.openalex)}" target="_blank" rel="noopener noreferrer">OpenAlex profile</a>` : ""} ${c.scholar ? `<a href="${esc(c.scholar)}" target="_blank" rel="noopener noreferrer">Scholar profile</a>` : ""}</div>
    <p class="meta">Folder: <code>${esc(c.folder)}</code> · ${c.records} records · ${c.complete} complete · ${c.partial} partial · ${c.unavailable} unavailable · ${c.duplicates} duplicates · ${c.review} flagged for review</p>
    <div class="tablewrap"><table class="grid"><thead><tr><th>#</th><th>Title</th><th>Year</th><th>Status</th><th>Attribution</th></tr></thead><tbody>
    ${recs.map(r => `<tr class="clk" data-open="${r.pid}"><td>${esc(r.record_key.split("-").pop())}</td><td>${esc(r.title)}</td><td>${esc(r.year)}</td><td>${badge(r.status)}</td><td style="font-size:12px;color:var(--muted)">${esc(r.attribution)}</td></tr>`).join("")}
    </tbody></table></div><p><button class="btn" data-cand="${esc(cid)}">Search within this candidate's papers</button></p></div>`;
  $("#cdetail").scrollIntoView({ block: "start", behavior: "smooth" });
}

// ---------- about
function renderAbout() {
  const c = LIB.index.counts;
  $("#about").innerHTML = `<h2>About this library</h2>
  <p>Built ${esc(LIB.index.built.replace("T", " "))} from <code>${esc(LIB.index.source_file)}</code> (tabs <i>Researchers (Pilot)</i> and <i>Research Papers (Pilot)</i>). No candidates or publications were added beyond that spreadsheet.</p>
  <table class="grid" style="max-width:520px"><tbody>
  <tr><td>Candidates</td><td class="n">${c.candidates}</td></tr><tr><td>Publication records (candidate × paper)</td><td class="n">${c.records.toLocaleString()}</td></tr>
  <tr><td>Unique publications</td><td class="n">${c.publications.toLocaleString()}</td></tr><tr><td>Complete full text</td><td class="n">${c.complete.toLocaleString()}</td></tr>
  <tr><td>Partial full text</td><td class="n">${c.partial.toLocaleString()}</td></tr><tr><td>Unavailable</td><td class="n">${c.unavailable.toLocaleString()}</td></tr>
  <tr><td>Duplicate records</td><td class="n">${c.duplicates.toLocaleString()}</td></tr></tbody></table>
  <h3>Status labels</h3><ul>
  <li><span class="b Complete">Complete</span> the correct paper was found and its full text extracted with no major issues.</li>
  <li><span class="b Partial">Partial</span> only part of the paper, a scanned PDF, a supplement, or text with major extraction issues.</li>
  <li><span class="b Unavailable">Unavailable</span> no legitimate open full text (paywall, 403, bot check, abstract or metadata only).</li>
  <li><span class="b Duplicate">Duplicate</span> the same publication appears more than once for the same candidate; the text is stored once.</li></ul>
  <h3>Search tips</h3><p>Search runs over the archived paper text, titles and author lists. Abstracts of papers without full text are excluded unless you tick the abstract option, and such results are labelled abstract only.
  Topics come from term counts in the paper's full text (the evidence is shown in the reader); papers without full text have no topic.</p>
  <p>Everything runs in this browser. The page loads only its own data files; links to DOIs and source pages only open when clicked.</p>
  <p>Full methods, counts and gaps: <code>Reports/IMPORT_REPORT.md</code> and <code>Reports/Publications Archive Tracker.xlsx</code>.</p>`;
}

// ---------- theme
$("#theme").addEventListener("click", () => {
  const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("irpl-theme", r.dataset.theme); } catch (e) {}
});
if (matchMedia("(max-width: 900px)").matches) $("#fdet").open = false;
try { const t = localStorage.getItem("irpl-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
boot();
</script>
</body>
</html>
